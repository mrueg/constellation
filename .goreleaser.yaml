version: 2

project_name: constellation

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Generate shell completions from the command tree so the archive ships
    # them without a second copy to maintain.
    - mkdir -p completions
    - sh -c 'go run . completion bash > completions/constellation.bash'
    - sh -c 'go run . completion zsh  > completions/_constellation'
    - sh -c 'go run . completion fish > completions/constellation.fish' 

builds:
  - id: constellation
    main: .
    binary: constellation
    # The whole program is pure Go, so the binaries stay static and portable.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: constellation
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE*
      - src: completions/*
        dst: completions

# Record what went into each archive, so a consumer can scan a release for
# known vulnerabilities without unpacking it and guessing at the dependency
# set.
sboms:
  - artifacts: archive

# Sign the checksum file with cosign in keyless mode: the signing identity is
# the GitHub Actions OIDC token for this workflow, so no private key has to be
# held anywhere. Signing the checksums covers every archive it lists, since a
# tampered archive would fail its checksum.
#
# cosign v3 writes the certificate and the signature together into one bundle;
# the older --output-certificate/--output-signature pair is rejected outright.
#
# Verify a download with:
#
#	cosign verify-blob \
#	  --bundle checksums.txt.bundle \
#	  --certificate-identity-regexp 'https://github.com/mrueg/constellation/.*' \
#	  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#	  checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

# Publish a Homebrew cask to the personal tap, so the binary can be installed
# with `brew install mrueg/tap/constellation` rather than by unpacking a
# tarball. A cask rather than a formula because these are prebuilt binaries;
# a formula would be expected to build from source.
#
# The tap lives in another repository, so the default GITHUB_TOKEN cannot write
# to it — TAP_GITHUB_TOKEN is a token with access to that one.
homebrew_casks:
  - repository:
      owner: mrueg
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/mrueg/constellation"
    description: "Turns your GitHub stars into organized star lists using an unsupervised ML model"
    license: "Apache-2.0"
    commit_author:
      name: Manuel Rüger
      email: manuel@rueg.eu
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/constellation"]
          end

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  footer: |
    Planning uses the GitHub REST API; star lists are read and written through
    the GraphQL API, which needs a token carrying the `user` scope
    (`gh auth refresh -s user`). See the README before running
    `constellation apply`.
